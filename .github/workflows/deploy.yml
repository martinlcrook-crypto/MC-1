name: Vibe Code Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Mist Dashboard to AWS Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          MIST_ORG_ID: ${{ secrets.MIST_ORG_ID }}
          MIST_API_TOKEN: ${{ secrets.MIST_API_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: MIST_ORG_ID,MIST_API_TOKEN
          script: |
            set -e
            cd ~/MC-1
            git pull origin main

            {
              printf 'MIST_API_HOST=https://api.eu.mist.com\n'
              printf 'MIST_ORG_ID=%s\n' "$MIST_ORG_ID"
              printf 'MIST_API_TOKEN=%s\n' "$MIST_API_TOKEN"
              printf 'CACHE_TTL_SECONDS=60\n'
              printf 'PORT=8080\n'
            } > .env
            chmod 600 .env

            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            .venv/bin/pip install --quiet --upgrade pip
            .venv/bin/pip install --quiet -r requirements.txt

            if [ -f app.pid ]; then
              kill "$(cat app.pid)" 2>/dev/null || true
            fi
            pkill -f "[w]aitress-serve.*app:app" || true
            sleep 1
            nohup .venv/bin/waitress-serve --host=0.0.0.0 --port=8080 app:app </dev/null >~/MC-1/app.log 2>&1 &
            echo $! > app.pid
            sleep 2
            curl -sf http://127.0.0.1:8080/health

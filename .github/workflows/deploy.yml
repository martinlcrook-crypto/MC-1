name: Vibe Code Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Mist Dashboard via systemd
        env:
          MIST_ORG_ID: ${{ secrets.MIST_ORG_ID }}
          MIST_API_TOKEN: ${{ secrets.MIST_API_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN || secrets.DUCK_DNS }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN || secrets.DUCK_DNS_TOKEN }}
        run: |
          set -e
          cd /home/ec2-user/MC-1
          git pull origin main

          {
            printf 'MIST_API_HOST=https://api.eu.mist.com\n'
            printf 'MIST_ORG_ID=%s\n' "$MIST_ORG_ID"
            printf 'MIST_API_TOKEN=%s\n' "$MIST_API_TOKEN"
            printf 'CACHE_TTL_SECONDS=60\n'
            printf 'PORT=80\n'
          } > .env
          chmod 600 .env

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install --quiet -r requirements.txt

          # Keep mist-dashboard reliably serving on 8080 (or 80+8080 if port 80 is free)
          PORT80_OWNER=""
          if sudo systemctl is-active --quiet nginx 2>/dev/null; then
            PORT80_OWNER="nginx"
          elif sudo systemctl is-active --quiet httpd 2>/dev/null; then
            PORT80_OWNER="httpd"
          elif sudo systemctl is-active --quiet apache2 2>/dev/null; then
            PORT80_OWNER="apache2"
          fi
          echo "Detected port 80 service: ${PORT80_OWNER:-none}"

          if [ -z "$PORT80_OWNER" ]; then
            printf 'net.ipv4.ip_unprivileged_port_start=80\n' | sudo tee /etc/sysctl.d/99-mist-http.conf >/dev/null
            sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80 >/dev/null
            WAITRESS_LISTEN='0.0.0.0:80 0.0.0.0:8080'
          else
            WAITRESS_LISTEN='0.0.0.0:8080'
          fi

          sudo tee /etc/systemd/system/mist-dashboard.service >/dev/null <<UNIT
          [Unit]
          Description=Mist EU Wireless & eduroam Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/MC-1
          EnvironmentFile=/home/ec2-user/MC-1/.env
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          ExecStart=/home/ec2-user/MC-1/.venv/bin/waitress-serve --listen="${WAITRESS_LISTEN}" app:app
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT

          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
            rm -f app.pid
            sleep 1
          fi

          sudo systemctl daemon-reload
          sudo systemctl enable mist-dashboard
          sudo systemctl restart mist-dashboard

          if [ "$PORT80_OWNER" = "nginx" ]; then
            if [ ! -f /etc/nginx/nginx.conf.orig ]; then
              sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.orig
            fi
            NGINX_USER="$(awk '/^user[[:space:]]+/{gsub(/;/,"",$2); print $2; exit}' /etc/nginx/nginx.conf.orig || true)"
            NGINX_USER="${NGINX_USER:-nginx}"
            sudo tee /etc/nginx/nginx.conf >/dev/null <<NGINX
          user ${NGINX_USER};
          worker_processes auto;
          error_log /var/log/nginx/error.log;
          pid /run/nginx.pid;

          events {
            worker_connections 1024;
          }

          http {
            include       /etc/nginx/mime.types;
            default_type  application/octet-stream;
            sendfile      on;
            keepalive_timeout 65;

            server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_read_timeout 120s;
              }
            }
          }
          NGINX
            sudo setsebool -P httpd_can_network_connect 1 2>/dev/null || true
            sudo nginx -t
            sudo systemctl reload nginx
          elif [ "$PORT80_OWNER" = "httpd" ]; then
            sudo tee /etc/httpd/conf.d/mist-dashboard.conf >/dev/null <<'HTTPD'
          <VirtualHost *:80>
            ProxyPreserveHost On
            ProxyPass / http://127.0.0.1:8080/
            ProxyPassReverse / http://127.0.0.1:8080/
          </VirtualHost>
          HTTPD
            sudo setsebool -P httpd_can_network_connect 1 2>/dev/null || true
            sudo systemctl reload httpd
          fi

          sleep 2
          sudo ss -tlnp '( sport = :80 or sport = :8080 )' || true
          curl -sf http://127.0.0.1:8080/health
          curl -sf http://127.0.0.1:80/health || { sudo journalctl -u mist-dashboard -n 20 --no-pager || true; exit 1; }

          # Keep DuckDNS (mc-uop-mist.duckdns.org) updated every 5 minutes when token is configured
          if [ -n "$DUCKDNS_TOKEN" ]; then
            CLEAN_DOMAIN="mc-uop-mist"
            CLEAN_TOKEN="$(printf '%s' "$DUCKDNS_TOKEN" | tr -d '\r\n[:space:]')"
            echo "Configuring DuckDNS for ${CLEAN_DOMAIN}.duckdns.org (token length: ${#CLEAN_TOKEN})"
            printf 'url = "https://www.duckdns.org/update?domains=%s&token=%s&ip="\n' "$CLEAN_DOMAIN" "$CLEAN_TOKEN" > .duckdns.curl
            chmod 600 .duckdns.curl

            sudo tee /etc/systemd/system/duckdns-update.service >/dev/null <<'UNIT'
          [Unit]
          Description=Update DuckDNS Dynamic DNS Record
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=ec2-user
          ExecStart=/usr/bin/env curl -fsS -K /home/ec2-user/MC-1/.duckdns.curl
          UNIT

            sudo tee /etc/systemd/system/duckdns-update.timer >/dev/null <<'UNIT'
          [Unit]
          Description=Run DuckDNS Update every 5 minutes

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min
          Unit=duckdns-update.service

          [Install]
          WantedBy=timers.target
          UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable --now duckdns-update.timer
            DUCK_RESP="$(curl -fsS -K /home/ec2-user/MC-1/.duckdns.curl)"
            echo "DuckDNS update response: ${DUCK_RESP}"
            if [ "$DUCK_RESP" != "OK" ]; then
              echo "DuckDNS update failed (expected OK, got: ${DUCK_RESP}; check DUCK_DNS_TOKEN — expected 36-char UUID)" >&2
              exit 1
            fi
          else
            echo "Skipping DuckDNS timer (set DUCK_DNS_TOKEN GitHub Secret to enable)."
          fi

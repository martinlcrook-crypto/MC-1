<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2544" />
      <stop offset="100%" stop-color="#081121" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0099da" />
      <stop offset="100%" stop-color="#84bd00" />
    </linearGradient>
    <linearGradient id="mcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Rounded dark Mist navy tile with Mist blue-to-green accent border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Juniper Mist green/cyan signal accent at top -->
  <path d="M 23 14.5 Q 32 9 41 14.5" fill="none" stroke="#84bd00" stroke-width="2.6" stroke-linecap="round" opacity="0.95" />
  <circle cx="32" cy="17.2" r="2" fill="#34d399" />

  <!-- Bold geometric M -->
  <path
    d="M 11.5 48.5 L 11.5 24.5 L 21.5 38.5 L 31.5 24.5 L 31.5 48.5"
    fill="none"
    stroke="url(#mcGrad)"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bold geometric C -->
  <path
    d="M 52.5 28.5 C 50 24.8 46.2 23.8 43 25 C 39.2 26.5 37.8 31 37.8 36.5 C 37.8 42 39.2 46.5 43 48 C 46.2 49.2 50 48.2 52.5 44.5"
    fill="none"
    stroke="url(#mcGrad)"
    stroke-width="5.2"
    stroke-linecap="round"
  />
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake — Mist Arcade</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1626;
      --panel-2: #141f34;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --green-bright: #6ee7b7;
      --amber: #fbbf24;
      --red: #f87171;
      --mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace;
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #101b33 0%, var(--bg) 68%);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      user-select: none;
    }

    .arcade-shell {
      height: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(14, 22, 38, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(56, 189, 248, 0.18));
      border: 1px solid rgba(52, 211, 153, 0.45);
      display: grid;
      place-items: center;
      color: var(--green);
      font-weight: 800;
      font-size: 16px;
    }

    .hud-title {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .hud-sub {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .scores {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-box {
      background: rgba(7, 11, 20, 0.8);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 12px;
      min-width: 82px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stat-val {
      font-family: var(--mono);
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }

    .stat-val.best { color: var(--amber); }
    .stat-val.len { color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      background: rgba(7, 11, 20, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    button {
      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 5px 9px;
      cursor: pointer;
      transition: all 140ms ease;
    }

    button:hover { color: var(--text); background: rgba(148, 163, 184, 0.1); }
    button.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.42);
    }

    .btn-pill {
      background: rgba(20, 31, 52, 0.9);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-pill:hover {
      border-color: var(--border-strong);
      color: var(--accent);
    }

    .btn-pill.on {
      border-color: rgba(52, 211, 153, 0.45);
      color: var(--green);
      background: rgba(52, 211, 153, 0.12);
    }

    .stage-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .board-frame {
      position: relative;
      height: 100%;
      max-height: 580px;
      aspect-ratio: 1 / 1;
      max-width: min(100%, 580px);
      background: #060a12;
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 14px;
      box-shadow:
        0 20px 50px -20px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 0 40px -18px rgba(52, 211, 153, 0.35);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 18, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      transition: opacity 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--green-bright), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay h1.dead {
      background: linear-gradient(135deg, #fca5a5, var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      max-width: 320px;
      line-height: 1.45;
    }

    .overlay-stats {
      font-family: var(--mono);
      font-size: 0.92rem;
      color: var(--text);
      background: rgba(14, 22, 38, 0.9);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      color: #041019;
      border: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px 22px;
      border-radius: 10px;
      box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.65);
    }

    .btn-primary:hover {
      color: #020810;
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.74rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .kbd {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 1.5px 5px;
      border-radius: 5px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 5px;
      flex-shrink: 0;
    }

    .dpad button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      border-radius: 10px;
      padding: 0;
    }

    .dpad button:active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent);
    }

    @media (max-width: 720px), (pointer: coarse) {
      .dpad { display: grid; }
      .stage-wrap { flex-direction: column; }
      .board-frame { max-height: 400px; }
    }
  </style>
</head>
<body>
  <div class="arcade-shell">
    <div class="hud">
      <div class="hud-brand">
        <div class="hud-icon" aria-hidden="true">🐍</div>
        <div>
          <div class="hud-title">Neon Snake</div>
          <div class="hud-sub">Mist Arcade Edition</div>
        </div>
      </div>

      <div class="scores">
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="scoreVal">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Best</div>
          <div class="stat-val best" id="bestVal">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Length</div>
          <div class="stat-val len" id="lenVal">3</div>
        </div>
      </div>

      <div class="controls">
        <div class="seg-group" role="group" aria-label="Game speed">
          <button type="button" data-speed="chill" onclick="setSpeed('chill')">Chill</button>
          <button type="button" data-speed="classic" class="active" onclick="setSpeed('classic')">Classic</button>
          <button type="button" data-speed="turbo" onclick="setSpeed('turbo')">Turbo</button>
        </div>
        <button id="wallsBtn" type="button" class="btn-pill" onclick="toggleWalls()" title="Toggle solid walls vs wrap-around edges">Walls: Solid</button>
        <button id="soundBtn" type="button" class="btn-pill on" onclick="toggleSound()" title="Toggle retro sound effects">SFX: On</button>
        <button id="pauseBtn" type="button" class="btn-pill" onclick="togglePause()">Pause</button>
      </div>
    </div>

    <div class="stage-wrap">
      <div class="board-frame" id="boardFrame">
        <canvas id="gameCanvas" width="560" height="560"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlayTitle">NEON SNAKE</h1>
          <p id="overlayDesc">Collect emerald packets (+10) and timed golden orbs (+50) without crashing into yourself.</p>
          <div id="overlayStats" class="overlay-stats" style="display:none;"></div>
          <button id="startBtn" type="button" class="btn-primary" onclick="startGame()">Play Now</button>
        </div>
      </div>

      <div class="dpad" aria-label="Touch direction controls">
        <span></span>
        <button type="button" onclick="queueDir(0, -1)" aria-label="Up">▲</button>
        <span></span>
        <button type="button" onclick="queueDir(-1, 0)" aria-label="Left">◀</button>
        <button type="button" onclick="togglePause()" aria-label="Pause">⏯</button>
        <button type="button" onclick="queueDir(1, 0)" aria-label="Right">▶</button>
        <span></span>
        <button type="button" onclick="queueDir(0, 1)" aria-label="Down">▼</button>
        <span></span>
      </div>
    </div>

    <div class="footer-bar">
      <div>Move: <span class="kbd">↑</span> <span class="kbd">↓</span> <span class="kbd">←</span> <span class="kbd">→</span> or <span class="kbd">W</span> <span class="kbd">A</span> <span class="kbd">S</span> <span class="kbd">D</span> · Pause: <span class="kbd">Space</span> · Restart: <span class="kbd">R</span></div>
      <div id="modeInfo">Classic speed · Solid walls · Golden bonus every 5 apples</div>
    </div>
  </div>

  <script>
    const GRID = 20;
    const SPEEDS = { chill: 135, classic: 96, turbo: 66 };
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speedKey = "classic";
    let wrapWalls = false;
    let soundOn = true;
    let audioCtx = null;

    let state = "idle"; // idle | playing | paused | gameover
    let snake = [];
    let dir = { x: 1, y: 0 };
    let inputQueue = [];
    let food = { x: 14, y: 10 };
    let bonus = null; // { x, y, expiresAt }
    let particles = [];
    let score = 0;
    let applesEaten = 0;
    let tickMs = SPEEDS.classic;
    let lastStepTs = 0;
    let rafId = null;

    function bestKey() {
      return `mist_snake_best_${speedKey}_${wrapWalls ? "wrap" : "solid"}`;
    }
    function loadBest() {
      try {
        return parseInt(localStorage.getItem(bestKey()) || "0", 10) || 0;
      } catch (e) { return 0; }
    }
    function saveBest(val) {
      try { localStorage.setItem(bestKey(), String(val)); } catch (e) {}
    }

    function playTone(freq, duration = 0.07, type = "square", gainVal = 0.055, endFreq = null) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function updateHud() {
      document.getElementById("scoreVal").textContent = String(score);
      document.getElementById("bestVal").textContent = String(Math.max(loadBest(), score));
      document.getElementById("lenVal").textContent = String(snake.length || 3);
      const speedLabel = speedKey.charAt(0).toUpperCase() + speedKey.slice(1);
      document.getElementById("modeInfo").textContent =
        `${speedLabel} speed · ${wrapWalls ? "Wrap-around walls" : "Solid walls"} · Golden bonus every 5 apples`;
      document.getElementById("pauseBtn").textContent = state === "paused" ? "Resume" : "Pause";
    }

    function randomFreeCell() {
      const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
      if (food) occupied.add(`${food.x},${food.y}`);
      if (bonus) occupied.add(`${bonus.x},${bonus.y}`);
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (!occupied.has(`${x},${y}`)) free.push({ x, y });
        }
      }
      if (!free.length) return null;
      return free[Math.floor(Math.random() * free.length)];
    }

    function spawnParticles(gx, gy, color, count = 14) {
      const cell = canvas.width / GRID;
      const cx = (gx + 0.5) * cell;
      const cy = (gy + 0.5) * cell;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 1.4 + Math.random() * 3.2;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.032 + Math.random() * 0.02,
          size: 2.5 + Math.random() * 3,
          color
        });
      }
    }

    function resetBoard() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      inputQueue = [];
      score = 0;
      applesEaten = 0;
      bonus = null;
      particles = [];
      tickMs = SPEEDS[speedKey];
      food = randomFreeCell() || { x: 14, y: 10 };
      updateHud();
    }

    function showOverlay(title, desc, btnText, isDead = false, statsText = "") {
      const ov = document.getElementById("overlay");
      const h1 = document.getElementById("overlayTitle");
      h1.textContent = title;
      h1.className = isDead ? "dead" : "";
      document.getElementById("overlayDesc").textContent = desc;
      document.getElementById("startBtn").textContent = btnText;
      const st = document.getElementById("overlayStats");
      if (statsText) {
        st.textContent = statsText;
        st.style.display = "block";
      } else {
        st.style.display = "none";
      }
      ov.classList.remove("hidden");
    }

    function hideOverlay() {
      document.getElementById("overlay").classList.add("hidden");
    }

    function blurActiveBtn() {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") {
        try { document.activeElement.blur(); } catch (e) {}
      }
    }

    function startGame() {
      blurActiveBtn();
      resetBoard();
      state = "playing";
      lastStepTs = performance.now();
      hideOverlay();
      updateHud();
      playTone(330, 0.08, "triangle", 0.06, 660);
    }

    function togglePause() {
      blurActiveBtn();
      if (state === "playing") {
        state = "paused";
        showOverlay("PAUSED", "Press Space or Resume to jump back in.", "Resume");
        document.getElementById("startBtn").onclick = togglePause;
        updateHud();
      } else if (state === "paused") {
        state = "playing";
        lastStepTs = performance.now();
        hideOverlay();
        document.getElementById("startBtn").onclick = startGame;
        updateHud();
      } else if (state === "idle" || state === "gameover") {
        startGame();
      }
    }

    function setSpeed(key) {
      blurActiveBtn();
      if (!SPEEDS[key]) return;
      speedKey = key;
      tickMs = SPEEDS[key];
      document.querySelectorAll("[data-speed]").forEach(b => b.classList.toggle("active", b.dataset.speed === key));
      updateHud();
    }

    function toggleWalls() {
      blurActiveBtn();
      wrapWalls = !wrapWalls;
      const btn = document.getElementById("wallsBtn");
      btn.textContent = wrapWalls ? "Walls: Wrap" : "Walls: Solid";
      btn.classList.toggle("on", wrapWalls);
      updateHud();
    }

    function toggleSound() {
      blurActiveBtn();
      soundOn = !soundOn;
      const btn = document.getElementById("soundBtn");
      btn.textContent = soundOn ? "SFX: On" : "SFX: Off";
      btn.classList.toggle("on", soundOn);
      if (soundOn) playTone(520, 0.06, "sine", 0.05);
    }

    function queueDir(dx, dy) {
      if (state === "idle") {
        startGame();
      }
      if (state !== "playing") return;
      const ref = inputQueue.length ? inputQueue[inputQueue.length - 1] : dir;
      if (ref.x === -dx && ref.y === -dy) return; // Prevent 180-degree reversal
      if (ref.x === dx && ref.y === dy) return;
      if (inputQueue.length < 3) {
        inputQueue.push({ x: dx, y: dy });
      }
    }

    function gameOver(reason) {
      state = "gameover";
      const prevBest = loadBest();
      const isNewBest = score > prevBest;
      if (isNewBest) saveBest(score);
      spawnParticles(snake[0].x, snake[0].y, "#f87171", 22);
      playTone(220, 0.24, "sawtooth", 0.07, 72);
      document.getElementById("startBtn").onclick = startGame;
      showOverlay(
        isNewBest ? "NEW HIGH SCORE!" : "GAME OVER",
        reason,
        "Play Again",
        !isNewBest,
        `Score: ${score} · Best: ${Math.max(prevBest, score)} · Length: ${snake.length}`
      );
      updateHud();
    }

    function stepGame(now) {
      if (inputQueue.length) {
        dir = inputQueue.shift();
      }
      const head = snake[0];
      let nx = head.x + dir.x;
      let ny = head.y + dir.y;

      if (wrapWalls) {
        nx = (nx + GRID) % GRID;
        ny = (ny + GRID) % GRID;
      } else if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
        gameOver("Hit the arena boundary. Try Wrap Walls mode or sharper turns!");
        return;
      }

      const willEatFood = food && nx === food.x && ny === food.y;
      const willEatBonus = bonus && nx === bonus.x && ny === bonus.y;
      const bodyCheck = (willEatFood || willEatBonus) ? snake : snake.slice(0, -1);
      if (bodyCheck.some(seg => seg.x === nx && seg.y === ny)) {
        gameOver("Crashed into your own tail.");
        return;
      }

      snake.unshift({ x: nx, y: ny });

      if (willEatFood) {
        score += 10;
        applesEaten += 1;
        spawnParticles(nx, ny, "#34d399", 16);
        playTone(540, 0.07, "triangle", 0.06, 820);
        // Gentle progressive acceleration as snake grows
        tickMs = Math.max(48, SPEEDS[speedKey] - Math.floor(applesEaten * 1.1));
        food = randomFreeCell();
        if (!food) {
          saveBest(Math.max(loadBest(), score));
          state = "gameover";
          showOverlay("PERFECT CLEAR!", "You filled the entire board!", "Play Again", false, `Score: ${score}`);
          updateHud();
          return;
        }
        if (applesEaten % 5 === 0 && !bonus) {
          const cell = randomFreeCell();
          if (cell) bonus = { x: cell.x, y: cell.y, expiresAt: now + 6500 };
        }
      } else if (willEatBonus) {
        score += 50;
        spawnParticles(nx, ny, "#fbbf24", 22);
        playTone(660, 0.14, "sine", 0.08, 1180);
        bonus = null;
      } else {
        snake.pop();
      }

      if (bonus && now >= bonus.expiresAt) {
        bonus = null;
      }
      if (score > loadBest()) {
        saveBest(score);
      }
      updateHud();
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
      else ctx.rect(x, y, w, h);
      ctx.fill();
    }

    function render(now) {
      const w = canvas.width;
      const h = canvas.height;
      const cell = w / GRID;

      // Deep obsidian board background
      ctx.fillStyle = "#060a12";
      ctx.fillRect(0, 0, w, h);

      // Subtle checkerboard grid
      for (let gx = 0; gx < GRID; gx++) {
        for (let gy = 0; gy < GRID; gy++) {
          if ((gx + gy) % 2 === 0) {
            ctx.fillStyle = "rgba(148, 163, 184, 0.03)";
            ctx.fillRect(gx * cell, gy * cell, cell, cell);
          }
        }
      }

      // Food (pulsing emerald packet)
      if (food) {
        const pulse = 1 + Math.sin(now / 180) * 0.1;
        const fx = (food.x + 0.5) * cell;
        const fy = (food.y + 0.5) * cell;
        ctx.save();
        ctx.shadowColor = "rgba(52, 211, 153, 0.85)";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#34d399";
        ctx.beginPath();
        ctx.arc(fx, fy, cell * 0.34 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#d1fae5";
        ctx.beginPath();
        ctx.arc(fx - cell * 0.09, fy - cell * 0.09, cell * 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Bonus golden orb with countdown ring
      if (bonus) {
        const remainRatio = Math.max(0, (bonus.expiresAt - now) / 6500);
        const bx = (bonus.x + 0.5) * cell;
        const by = (bonus.y + 0.5) * cell;
        ctx.save();
        ctx.shadowColor = "rgba(251, 191, 36, 0.9)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(bx, by, cell * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fef3c7";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(bx, by, cell * 0.44, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * remainRatio);
        ctx.stroke();
        ctx.restore();
      }

      // Snake body (tail to head with neon gradient & tapered tail)
      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const t = i / Math.max(1, snake.length - 1);
        const pad = i === 0 ? 1.5 : 2 + t * 2.4;
        const x = seg.x * cell + pad;
        const y = seg.y * cell + pad;
        const s = cell - pad * 2;
        ctx.save();
        if (i === 0) {
          ctx.shadowColor = "rgba(56, 189, 248, 0.7)";
          ctx.shadowBlur = 14;
          ctx.fillStyle = "#38bdf8";
        } else {
          const r = Math.round(56 - t * 30);
          const g = Math.round(211 - t * 65);
          const b = Math.round(180 - t * 35);
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        }
        drawRoundedRect(x, y, s, s, i === 0 ? 7 : 6);
        ctx.restore();

        // Eyes on snake head
        if (i === 0) {
          const cx = seg.x * cell + cell * 0.5;
          const cy = seg.y * cell + cell * 0.5;
          const eyeOffForward = cell * 0.18;
          const eyeOffSide = cell * 0.18;
          const e1x = cx + dir.x * eyeOffForward - dir.y * eyeOffSide;
          const e1y = cy + dir.y * eyeOffForward + dir.x * eyeOffSide;
          const e2x = cx + dir.x * eyeOffForward + dir.y * eyeOffSide;
          const e2y = cy + dir.y * eyeOffForward - dir.x * eyeOffSide;
          ctx.fillStyle = "#041019";
          ctx.beginPath();
          ctx.arc(e1x, e1y, cell * 0.085, 0, Math.PI * 2);
          ctx.arc(e2x, e2y, cell * 0.085, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function loop(now) {
      if (state === "playing" && now - lastStepTs >= tickMs) {
        lastStepTs = now;
        stepGame(now);
      }
      render(now);
      rafId = requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", ev => {
      const k = ev.key;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) {
        ev.preventDefault();
      }
      if (k === "ArrowUp" || k === "w" || k === "W") queueDir(0, -1);
      else if (k === "ArrowDown" || k === "s" || k === "S") queueDir(0, 1);
      else if (k === "ArrowLeft" || k === "a" || k === "A") queueDir(-1, 0);
      else if (k === "ArrowRight" || k === "d" || k === "D") queueDir(1, 0);
      else if (k === " ") togglePause();
      else if (k === "r" || k === "R") startGame();
      else if (k === "Enter" && (state === "idle" || state === "gameover")) startGame();
    });

    // Touch swipe support on canvas
    let touchStart = null;
    canvas.addEventListener("touchstart", ev => {
      const t = ev.touches[0];
      if (t) touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", ev => {
      if (!touchStart) return;
      const t = ev.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
      else queueDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    resetBoard();
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
